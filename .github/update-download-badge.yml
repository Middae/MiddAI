name: Update download badge

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: write

jobs:
  update-badge:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Generate badge from real GitHub release downloads
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          total=$(gh api "repos/${GITHUB_REPOSITORY}/releases" --paginate --jq '.[].assets[].download_count' | awk '{s+=$1} END {print s+0}')

          mkdir -p assets

          cat > assets/downloads-badge.svg <<SVG
          <svg xmlns="http://www.w3.org/2000/svg" width="190" height="28" role="img" aria-label="GitHub Downloads: ${total}">
            <title>GitHub Downloads: ${total}</title>
            <rect width="130" height="28" fill="#555"/>
            <rect x="130" width="60" height="28" fill="#2ea44f"/>
            <g fill="#fff" text-anchor="middle" font-family="Verdana,Geneva,DejaVu Sans,sans-serif" font-size="11">
              <text x="65" y="18">GitHub Downloads</text>
              <text x="160" y="18">${total}</text>
            </g>
          </svg>
          SVG

          echo "Total GitHub release downloads: ${total}"

      - name: Commit updated badge
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if git diff --quiet; then
            echo "No badge changes."
          else
            git add assets/downloads-badge.svg
            git commit -m "Update download badge"
            git push
          fi
