name: Update download badge

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: write

jobs:
  update-badge:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Generate download badge
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          python3 <<'PY'
          import os
          import json
          import urllib.request
          import html
          from pathlib import Path

          repo = os.environ["REPO"]
          token = os.environ["GITHUB_TOKEN"]

          total = 0
          page = 1

          while True:
              url = f"https://api.github.com/repos/{repo}/releases?per_page=100&page={page}"
              req = urllib.request.Request(url)
              req.add_header("Authorization", f"Bearer {token}")
              req.add_header("Accept", "application/vnd.github+json")
              req.add_header("X-GitHub-Api-Version", "2022-11-28")

              with urllib.request.urlopen(req) as response:
                  releases = json.loads(response.read().decode("utf-8"))

              if not releases:
                  break

              for release in releases:
                  for asset in release.get("assets", []):
                      total += int(asset.get("download_count", 0))

              page += 1

          label = "GitHub Downloads"
          count = str(total)

          left_width = 130
          right_width = max(48, 18 + len(count) * 9)
          total_width = left_width + right_width

          svg = f'''<svg xmlns="http://www.w3.org/2000/svg" width="{total_width}" height="28" role="img" aria-label="{html.escape(label)}: {html.escape(count)}">
            <title>{html.escape(label)}: {html.escape(count)}</title>
            <rect width="{left_width}" height="28" fill="#555"/>
            <rect x="{left_width}" width="{right_width}" height="28" fill="#2ea44f"/>
            <g fill="#fff" text-anchor="middle" font-family="Verdana,Geneva,DejaVu Sans,sans-serif" font-size="11">
              <text x="{left_width / 2}" y="18">{html.escape(label)}</text>
              <text x="{left_width + right_width / 2}" y="18">{html.escape(count)}</text>
            </g>
          </svg>
          '''

          Path("assets").mkdir(exist_ok=True)
          Path("assets/downloads-badge.svg").write_text(svg, encoding="utf-8")

          print(f"Total GitHub release downloads: {total}")
          PY

      - name: Commit badge update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if git diff --quiet; then
            echo "No badge changes."
          else
            git add assets/downloads-badge.svg
            git commit -m "Update download badge"
            git push
          fi
